name: Predeploy fix verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Synchronize package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit synchronized lockfile if needed
        shell: bash
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Sync package lock [skip ci]"
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          fi

      - name: Clean install
        run: npm ci

      - name: JavaScript syntax checks
        run: |
          node --check worker/auth.js
          node --check worker/routes/auth.js

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run
